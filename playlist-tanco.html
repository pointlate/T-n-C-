<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tân cổ giao duyên</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--card:#fff;--accent:#d92b2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--card:#1e1e1e;--accent:#ff5a5a}}
:root[data-theme="dark"]{--bg:#121212;--fg:#eee;--card:#1e1e1e;--accent:#ff5a5a}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:1.2rem;margin:0 0 12px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
a.btn{background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:.95rem}
a.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--accent)}
p{font-size:.85rem;opacity:.7}
@media (orientation:landscape) and (max-height:500px){
body{padding:0;max-width:none}
h1{display:none}
.player{border-radius:0;aspect-ratio:auto;height:100vh;height:100dvh}
:root{padding:0}
}
</style>
</head>
<body>
<h1>▶ Tân cổ giao duyên</h1>
<div class="player">
<div id="yt"></div>
</div>
<p id="msg"></p>
<script>
var LIST="PLMYt4jaQ3Z0ctCeisPzU83QM9yYaQ5u47",player,total=0,started=false,skips=0;
function pick(){
 var i=Math.floor(Math.random()*total);
 player.cuePlaylist({listType:"playlist",list:LIST,index:i});
 setTimeout(function(){try{player.setShuffle(true)}catch(e){}},800);
}
function onYouTubeIframeAPIReady(){
 player=new YT.Player("yt",{
  host:"https://www.youtube-nocookie.com",
  width:"100%",height:"100%",
  playerVars:{listType:"playlist",list:LIST,rel:0,modestbranding:1,playsinline:1},
  events:{
   onReady:function(){
    var tries=0,t=setInterval(function(){
     var l=player.getPlaylist&&player.getPlaylist();
     if(l&&l.length){clearInterval(t);total=l.length;pick()}
     else if(++tries>40){clearInterval(t)}
    },250);
   },
   onStateChange:function(e){if(e.data===1){started=true;skips=0}},
   onError:function(e){
    document.getElementById("msg").textContent="Mã lỗi: "+e.data+" | bài "+(player.getPlaylistIndex()+1)+"/"+total+" | thử lần "+skips;
    if(++skips>20)return;
    if(started){try{player.nextVideo()}catch(e){}}
    else if(total){setTimeout(pick,400)}
   }
  }
 });
}
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
